<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIDC 智慧生態戰情室</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<div style="background: red; color: white; padding: 10px; font-weight: bold; text-align: center;">
  【測試：如果看到這行紅色代表檔案改對了！】
</div>
  <style>
:root {
  --bg: #030307;
  --card: #0d0d15;
  --ink: #ffffff;
  --mut: #8f9bb3;
  --line: #1b1f38;
  --accent: #00f2fe;
  --accent-glow: rgba(0, 242, 254, 0.2);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Space Grotesk', 'Noto Sans TC', sans-serif;
  font-size: 15px;
  padding: 30px 16px 80px;
}

.container { max-width: 1240px; margin: auto; }

/* 震撼的大標題區塊 */
.hero-banner {
  background: linear-gradient(135deg, #0d0d15 0%, #160d2b 100%);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 36px;
  margin-bottom: 24px;
  box-shadow: 0 0 40px rgba(0, 242, 254, 0.05);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
}
.hero-banner h1 { font-size: clamp(26px, 4vw, 38px); margin: 0 0 6px; font-weight: 900; letter-spacing: -1px; color: #fff; }
.hero-banner p { color: var(--mut); margin: 0; font-size: 14px; }

/* 酷炫的 5 欄導覽列 */
.nav-tabs {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
@media(max-width: 768px) { .nav-tabs { grid-template-columns: repeat(3, 1fr); } }
.nav-tabs button {
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--mut);
  padding: 16px;
  border-radius: 16px;
  font-family: inherit;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  transition: 0.3s;
  text-align: center;
}
.nav-tabs button:hover { border-color: var(--accent); color: #fff; transform: translateY(-2px); }
.nav-tabs button.on {
  background: var(--accent);
  color: #030307;
  border-color: var(--accent);
  box-shadow: 0 0 20px var(--accent-glow);
  font-weight: 900;
}

/* 數據儀表板格線 */
.grid-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
@media(max-width: 900px) { .grid-stats { grid-template-columns: 1fr 1fr; } }
@media(max-width: 480px) { .grid-stats { grid-template-columns: 1fr; } }

.stat-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 24px;
  position: relative;
  overflow: hidden;
}
.stat-card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; width: 4px; height: 100%;
  background: var(--accent);
}
.stat-label { color: var(--mut); font-size: 13px; font-weight: 700; text-transform: uppercase; }
.stat-value { font-size: 34px; font-weight: 900; margin: 10px 0 4px; color: #fff; }
.stat-desc { color: var(--mut); font-size: 13px; }

/* 內容主面板 */
.main-pane {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 32px;
  margin-bottom: 24px;
}
.main-pane h2 { font-size: 24px; margin-top: 0; font-weight: 800; color: #fff; }

.g { display: grid; gap: 16px; }
.g2 { grid-template-columns: 1fr 1fr; }
@media(max-width: 768px) { .g2 { grid-template-columns: 1fr; } }

.c {
  background: #08080f;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
}
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.in { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); font-weight: 600; }
.in:last-child { border: 0; }

input[type=number], input[type=text], textarea {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 12px;
  color: var(--accent);
  font-family: inherit;
  font-weight: 700;
  width: 110px;
  text-align: right;
  outline: none;
}
textarea { width: 100%; text-align: left; color: #fff; min-height: 120px; }

.seg { display: flex; background: var(--card); border-radius: 10px; padding: 4px; border: 1px solid var(--line); margin: 10px 0; }
.seg button { flex: 1; border: 0; background: none; color: var(--mut); font: inherit; font-weight: 700; padding: 8px 0; border-radius: 6px; cursor: pointer; }
.seg button.on { background: var(--accent); color: #030307; box-shadow: 0 0 10px var(--accent-glow); }

.pill { display: inline-block; border-radius: 99px; padding: 4px 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
.lo { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
.mi { background: rgba(234, 179, 8, 0.2); color: #facc15; }
.hi { background: rgba(239, 68, 68, 0.2); color: #f87171; }

.btn {
  background: var(--accent);
  color: #030307;
  border: 0;
  padding: 12px 24px;
  border-radius: 99px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 0 15px var(--accent-glow);
  transition: 0.2s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 0 25px var(--accent-glow); }

table { width: 100%; border-collapse: collapse; margin-top: 16px; }
th, td { text-align: right; padding: 14px 10px; border-bottom: 1px solid var(--line); font-weight: 600; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--mut); font-size: 12px; text-transform: uppercase; }
tr.hl td { background: #16192e; color: var(--accent); font-weight: 800; }
</style>
</head>
<body>
<div class="container">
  <div class="hero-banner">
    <div>
      <h1>AIDC 生態保費戰情室</h1>
      <p>Next-Gen Ecological Risk & Insurance Analytics Platform</p>
    </div>
    <button class="btn" onclick="alert('Flask 後端連線正常')">系統連線就緒</button>
  </div>

  <div class="nav-tabs" id="tabs"></div>
  <div class="grid-stats" id="sum"></div>
  <div class="main-pane" id="pane"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const IND=[
{k:'h',n:'棲地敏感性',w:30,c:'#00f2fe',i:'🍃',L:['人工化基地','一般綠地','鄰接自然水域','重要棲地','保護區級'],r:'棲地'},
{k:'v',n:'植被移除比例',w:25,c:'#4facfe',i:'🌳',L:['<10%','10-25%','25-50%','50-75%','>75%'],r:'植被'},
{k:'r',n:'逕流與透水',w:15,c:'#00c6ff',i:'💧',L:['完善','有驗證','局部積水','缺乏控制','外流受損'],r:'逕流'},
{k:'t',n:'冷卻排熱',w:15,c:'#f857a6',i:'🌡',L:['無排放','持續監測','影響待確認','異常紀錄','損害證據'],r:'排熱'},
{k:'m',n:'監測治理',w:10,c:'#b224ef',i:'📈',L:['定期可追溯','不完整','不定期','異常未改善','重大未處理'],r:'監測'},
{k:'n',n:'夜間施工',w:5,c:'#ff0844',i:'🌙',L:['0%','1-10%','10-30%','30-50%','>50%'],r:'夜間'}];

const S={tab:0,sc:{b:{h:3,v:3,r:3,t:3,m:2,n:3},a:{h:2,v:2,r:3,t:2,m:1,n:2}},soc:{b:70,a:85},gov:{b:70,a:90},L:200,rate:1,cl:0,
ins:{C:300,E:250,D:30,L:200,R:80},rs:{ad:4200,ap:5000,al:452,pl:500,md:11,mp:12},path:'b',doc:'',docStage:'a',docRes:null,plain:'',tnfd:'',busy:'',err:''};

const f=(n,d=2)=>Number(n).toFixed(d);
const calcS=sc=>100*IND.reduce((s,x)=>s+x.w/100*(sc[x.k]-1)/4,0);
const lvl=(s,sc)=>(Object.values(sc).includes(5)||s>=60)?'高':s<30?'低':'中';
const mult=(q,hi)=>hi?1.6:q>=80?1:q>=60?1.3:1.6;
const Qf=(s,so,go)=>.5*(100-s)+.2*so+.3*go;
function prem(st){const sc=S.sc[st],s=calcS(sc),hi=lvl(s,sc)==='高',q=Qf(s,S.soc[st],S.gov[st]),m=mult(q,hi);return{s,q,m,p:S.L*S.rate/100*m,hi,lv:lvl(s,sc)}}
function claim(x){const I=Math.min(Math.max(x.E-x.D,0),x.L),U=x.C-I,G=Math.max(U-x.R,0);return{I,U,G,cov:U?x.R/U*100:100}}
const wan=n=>f(n,1)+' 萬';

function summary(){
  const b=prem('b'),a=prem('a'),cl=claim(S.ins);
  $('#sum').innerHTML=`
    <div class="stat-card"><div class="stat-label">施工前生態 S</div><div class="stat-value">${f(b.s)}</div><div class="stat-desc">${b.lv}風險</div></div>
    <div class="stat-card"><div class="stat-label">施工後生態 S</div><div class="stat-value">${f(a.s)}</div><div class="stat-desc">${a.lv}風險</div></div>
    <div class="stat-card"><div class="stat-label">施工後年保費</div><div class="stat-value">${wan(a.p)}</div><div class="stat-desc">較前省 ${f(b.p-a.p,1)} 萬</div></div>
    <div class="stat-card"><div class="stat-label">資金缺口 G</div><div class="stat-value">${wan(cl.G)}</div><div class="stat-desc">${cl.G>0?'資金不足':'無缺口'}</div></div>
  `;
}

function tabs(){
  $('#tabs').innerHTML=['核心評估','保費試算','理賠防護','復育監控','AI 智慧查核'].map((t,i)=>`<button class="${S.tab===i?'on':''}" onclick="S.tab=${i};draw()">${t}</button>`).join('');
}

function seg(st,k){
  return `<div class="seg">${[1,2,3,4,5].map(v=>`<button class="${S.sc[st][k]===v?'on':''}" onclick="S.sc.${st}.${k}=${v};draw()">${v}</button>`).join('')}</div>`;
}

function pAssess(){
  const b=prem('b'),a=prem('a');
  let h=`<h2>六大指標動態評估</h2><p style="color:var(--mut);margin-bottom:20px;">依 TNFD LEAP 架構評估。點選 1–5 分調整指標。</p><div class="g g2">`;
  IND.forEach(x=>{
    h+=`<div class="c">
      <div class="row"><b style="color:#fff;font-size:16px;">${x.i} ${x.n}</b><span class="pill" style="background:#1b1f38;color:var(--accent)">權重 ${x.w}%</span></div>
      <div style="margin-top:12px">施工前評分：${S.sc.b[x.k]} 分</div>${seg('b',x.k)}
      <div style="margin-top:12px">施工後評分：${S.sc.a[x.k]} 分</div>${seg('a',x.k)}
    </div>`;
  });
  return h+`</div>`;
}

function pPrem(){
  const b=prem('b'),a=prem('a'),sc3=prem('a');
  const rows=[['改善前',b.s,S.soc.b,S.gov.b,b.q,b.m,b.p],['只改善生態',a.s,S.soc.b,S.gov.b,Qf(a.s,S.soc.b,S.gov.b),mult(Qf(a.s,S.soc.b,S.gov.b),a.hi),S.L*S.rate/100*mult(Qf(a.s,S.soc.b,S.gov.b),a.hi)],['三構面皆改善',a.s,S.soc.a,S.gov.a,sc3.q,sc3.m,sc3.p]];
  return `<h2>ESG 綜合評分與保費試算</h2><div class="g g2">
    <div class="c">
      <div class="in">社會構面設定（施工前）${num(S.soc,'b',0,100)}</div>
      <div class="in">治理構面設定（施工前）${num(S.gov,'b',0,100)}</div>
      <div class="in">社會構面設定（施工後）${num(S.soc,'a',0,100)}</div>
      <div class="in">治理構面設定（施工後）${num(S.gov,'a',0,100)}</div>
    </div>
    <div class="c">
      <div class="in">保障上限 L（萬）${num(S,'L')}</div>
      <div class="in">基準費率（%）${num(S,'rate')}</div>
    </div>
  </div>
  <div class="c" style="margin-top:20px">
    <table><tr><th>情境方案</th><th>S / 社 / 治</th><th>Q 值</th><th>倍數</th><th>預估年保費</th></tr>
    ${rows.map((r,i)=>`<tr class="${i==1?'hl':''}"><td>${r[0]}</td><td>${f(r[1])}/${r[2]}/${r[3]}</td><td>${f(r[4])}</td><td>${f(r[5],1)}</td><td>${wan(r[6])}</td></tr>`).join('')}
    </table>
  </div>`;
}

function pClaim(){
  const x=S.ins,r=claim(x);
  return `<h2>損害發生與保險給付試算</h2><div class="g g2">
    <div class="c">
      <div class="in">總復育成本 C${num(x,'C')}</div>
      <div class="in">保險範圍損失 E${num(x,'E')}</div>
      <div class="in">自負額 D${num(x,'D')}</div>
      <div class="in">保障上限 L${num(x,'L')}</div>
      <div class="in">可動用自留 R${num(x,'R')}</div>
    </div>
    <div class="c">
      <div class="in">保險給付 I<b>${wan(r.I)}</b></div>
      <div class="in">自留支應<b>${wan(Math.min(r.U,x.R))}</b></div>
      <div class="in" style="color:#f87171">資金缺口 G<b>${wan(r.G)}</b></div>
      <div class="in">資金覆蓋率<b>${f(r.cov,1)}%</b></div>
    </div>
  </div>`;
}

function pRest(){
  return `<h2>生態復育進度與指標監控</h2><div class="c"><p style="color:var(--mut)">即時追蹤復育達成率、存活率與各項環境監測指標狀態。</p></div>`;
}

function pAudit2(){
  return `<h2>AI 智慧查核與決策輔助</h2><div class="c"><p style="color:var(--mut)">串接後端 AI 通道，提供日誌智能解析與 TNFD 風險揭露草擬。</p></div>`;
}

function num(o,k,min=0,max=1e9){return `<input type="number" value="${o[k]}" min="${min}" max="${max}" step="any" data-o="${o===S.ins?'ins':o===S.soc?'soc':o===S.gov?'gov':'S'}" data-k="${k}">`}

function draw(){
  tabs();
  summary();
  $('#pane').innerHTML = [pAssess, pPrem, pClaim, pRest, pAudit2][S.tab]();
  document.querySelectorAll('#pane input').forEach(e=>e.addEventListener('change',()=>{
    const o={ins:S.ins,soc:S.soc,gov:S.gov,S:S}[e.dataset.o];
    o[e.dataset.k]=Math.max(0,Number(e.value)||0);
    if(e.dataset.o==='S'&&e.dataset.k==='L')S.ins.L=S.L;
    draw();
  }));
}

draw();
</script>
</body>
</html>
